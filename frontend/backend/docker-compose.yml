# Rodar a API localmente em Docker, apontando para o seu banco do Supabase:
#   cp .env.example .env   (preencha DATABASE_URL, DIRECT_URL, JWT_SECRET)
#   docker compose up --build
#
# Para testar sem usar o Supabase, suba também um Postgres local:
#   docker compose --profile local-db up --build
#   (e use no .env: DATABASE_URL=postgresql://postgres:postgres@db:5432/concursos  DATABASE_SSL=false)
services:
  api:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    restart: unless-stopped

  db:
    profiles: ["local-db"]
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: concursos
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata:
