# Blueprint do Render: API (Docker) + site estático (frontend).
# O banco é só o Postgres do Supabase — nada de banco no Render.
services:
  - type: web
    name: caderno-concursos-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    envVars:
      # Supabase → Connect → "Session pooler" (porta 5432, funciona em IPv4)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: ALLOW_REGISTRATION
        value: "true"
      # URL do site estático abaixo, sem barra no final (ex.: https://caderno-concursos.onrender.com)
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: caderno-concursos
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # o app usa rotas do navegador (/c/:id/edital): qualquer caminho volta ao index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # URL pública da API acima (ex.: https://caderno-concursos-api.onrender.com)
      - key: VITE_API_URL
        sync: false
